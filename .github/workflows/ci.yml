name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (pnpm)
    runs-on: ubuntu-latest

    env:
      DATA_PATH: ./data
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-placeholder-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test
